name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec tsc -p party/tsconfig.json
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-bundle-size.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright boots both Workers (dev:all) itself, then drives two browser contexts.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy both Workers on merge to main. Requires repo secrets:
  #   CLOUDFLARE_API_TOKEN   — token with Workers Scripts + Durable Objects edit rights
  #   CLOUDFLARE_ACCOUNT_ID  — the target Cloudflare account id
  # The Nuxt Worker reads NUXT_PUBLIC_PARTY_HOST at runtime; set it on the `estimateroom`
  # Worker (dashboard var or `wrangler secret`) to the deployed party Worker's host.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Realtime party Worker first, so the app points at a live host.
      - run: pnpm exec wrangler deploy --config party/wrangler.jsonc
      - run: pnpm build
      - run: pnpm exec wrangler deploy
